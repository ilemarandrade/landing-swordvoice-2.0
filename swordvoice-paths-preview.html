:root{
  --background:#000;--foreground:#fff;--primary:#ff7a00;--primary-hover:#ffa34d;--secondary:#00c2ff;--blue:#104454;
  --blurry:#00000099;--surface-glass:#000e2799;--border-subtle:rgba(255,255,255,.15);--border-control:rgba(255,255,255,.25);
  --option-fill-selected:rgba(255,122,0,.12);--text-soft:#e6e6ee;--text-muted:#c9c9d6;--text-subtle:#9a9aae;
  --radius-xl:12px;--radius-card:18px;--radius-full:9999px;--content-max:1200px;--navbar-offset:85px;
  --font-display:"Sedgwick Ave","Comic Sans MS",cursive;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{max-width:var(--content-max);margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 48px}}
.display{font-family:var(--font-display);font-weight:400}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-subtle)}
.tag{font-size:11px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border-control);color:var(--text-muted);border-radius:var(--radius-full);padding:1px 8px;white-space:nowrap}
.link{color:var(--primary);text-decoration:none;font-weight:400}
.link:hover{color:var(--primary-hover);text-decoration:underline}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* Button / ButtonLink (bundle.css .sv-button) */
.btn{width:max-content;display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:var(--radius-full);
  border:2px solid var(--foreground);background:var(--background);padding:8px 32px;font-size:16px;line-height:24px;font-weight:700;
  color:var(--primary);text-decoration:none;cursor:pointer;transition:color .15s,background-color .15s}
.btn:hover{background:var(--primary);color:var(--background)}

.section-title{font-size:36px;line-height:40px;text-align:center}
@media(min-width:768px){.section-title{font-size:48px;line-height:1}}
.section-title span{color:var(--primary)}
.section-lead{font-size:17px;line-height:1.625;color:var(--text-soft);text-align:center;max-width:560px;margin:12px auto 32px}
.paths-grid{display:grid;gap:24px;grid-template-columns:1fr;max-width:880px;margin:0 auto}
@media(min-width:768px){.paths-grid{grid-template-columns:1fr 1fr}}
.path-card{position:relative;display:flex;flex-direction:column;gap:24px;padding:24px;border-radius:var(--radius-card);
  border:1px solid var(--border-subtle);background:var(--surface-glass);overflow:hidden;transition:border-color .2s}
@media(min-width:768px){.path-card{padding:40px}}
.path-card:hover{border-color:var(--border-control)}
.path-card__top{display:flex;align-items:center;gap:20px}
.path-icon{width:85px;height:85px;flex:none;color:var(--secondary)}
.path-card__name{font-size:40px;line-height:1.1}
.path-card__desc{font-size:15px;color:var(--text-muted);margin-top:4px}
/* Divisor espada: empuñadura + hoja */
.sword-rule{display:flex;align-items:center;gap:0;color:var(--secondary)}
.sword-rule svg{flex:none}
.sword-rule i{flex:1;height:2px;background:linear-gradient(90deg,var(--secondary),var(--border-subtle))}
.sword-rule b{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:10px solid var(--border-subtle)}
.path-card__meta{display:flex;gap:24px}
.path-card__meta div{display:flex;flex-direction:column;gap:2px}

.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px}
.hero__grid{display:flex;flex-direction:column;gap:24px;margin-top:16px}
@media(min-width:768px){.hero__grid{flex-direction:row;align-items:center;gap:32px}}
.hero .path-icon{width:96px;height:96px}
.hero__title{font-size:56px;line-height:1.1;margin-top:4px}
@media(min-width:768px){.hero__title{font-size:64px}}
.hero__lead{font-size:17px;line-height:1.625;color:var(--text-soft)}
.hero__stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px;font-size:15px;color:var(--text-muted)}
.hero__stats b{color:var(--foreground)}
.hero__cta{margin-left:auto}
.progress{margin-top:24px;max-width:560px}
.progress__row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress__pct{font-family:var(--font-display);font-size:26px;line-height:1.2;color:var(--secondary)}
.progress__bar{height:8px;border-radius:var(--radius-full);background:var(--border-subtle);overflow:hidden}
.progress__bar i{display:block;height:100%;background:var(--secondary);border-radius:inherit}

.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;padding-top:16px;padding-bottom:80px}
@media(min-width:960px){.detail{grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start}}

/* Aside: Pruebas requeridas */
.aside{position:relative;display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:var(--radius-card);border:1px solid var(--border-subtle);background:var(--surface-glass)}
@media(min-width:960px){.aside{position:sticky;top:24px;order:2}}
.aside__title{font-size:22px;line-height:1.3;color:var(--secondary)}
.aside__sub{font-size:13px;line-height:1.375;color:var(--text-subtle);margin-top:-8px}
.cert{display:flex;gap:12px;padding:14px;border-radius:var(--radius-xl);border:1px solid var(--border-subtle)}
.cert--done{border-color:var(--secondary)}
.cert__icon{width:28px;height:28px;flex:none;color:var(--text-subtle)}
.cert--done .cert__icon{color:var(--secondary)}
.cert__name{font-weight:700;font-size:15px;line-height:1.4}
.cert__meta{font-size:13px;color:var(--text-subtle);margin:2px 0 6px}
.cert__status{font-size:13px;color:var(--secondary)}

/* Camino de la espada */
.trail{position:relative;list-style:none;padding-left:64px}
.trail::before{content:"";position:absolute;left:29px;top:72px;bottom:48px;width:4px;border-radius:2px;background:var(--border-subtle)}
.trail__fill{position:absolute;left:29px;top:72px;width:4px;border-radius:2px;background:var(--secondary);transition:height .6s ease}
.hilt{position:absolute;left:7px;top:0;width:48px;height:76px;color:var(--secondary)}
.tip{position:absolute;left:23px;bottom:24px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:24px solid var(--border-subtle)}
.trail.is-complete .tip{border-top-color:var(--secondary)}
.trail__head{padding:20px 0 28px;min-height:76px}
.step{position:relative;margin-bottom:16px}
.node{position:absolute;left:-46px;top:22px;width:24px;height:24px;transform:rotate(45deg);background:var(--background);border:2px solid var(--border-control);border-radius:4px;display:grid;place-items:center}
.node svg{transform:rotate(-45deg);width:12px;height:12px}
.step--done .node{background:var(--secondary);border-color:var(--secondary);color:var(--background)}
.step--current .node{border-color:var(--primary);box-shadow:0 0 0 4px var(--option-fill-selected)}

.topic{border-radius:var(--radius-card);border:1px solid var(--border-subtle);background:var(--surface-glass);overflow:hidden}
.step--current .topic{border-color:var(--primary)}
.topic__btn{width:100%;display:flex;align-items:center;gap:16px;min-height:68px;padding:12px 20px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.topic__btn:hover .topic__title{text-decoration:underline;text-decoration-color:var(--border-control);text-underline-offset:4px}
.topic__num{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--secondary);min-width:36px}
.topic__main{flex:1;min-width:0}
.topic__title{font-size:18px;line-height:24px;font-weight:700}
.topic__info{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;font-size:13px;color:var(--text-subtle)}
.topic__status{font-size:13px}
.step--done .topic__status{color:var(--secondary)}
.step--current .topic__status{color:var(--primary)}
.chev{width:20px;height:20px;flex:none;color:var(--text-muted);transition:transform .25s}
.topic__btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.topic__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.topic__panel.open{grid-template-rows:1fr}
.topic__panel>div{overflow:hidden}
.topic__body{padding:4px 20px 20px 72px;display:flex;flex-direction:column;gap:20px}
@media(max-width:600px){.topic__body{padding-left:20px}}
.topic__desc{font-size:15px;color:var(--text-muted)}
.subs{list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--border-subtle)}
.sub{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle)}
.sub__check{width:20px;height:20px;flex:none;margin-top:2px;border-radius:6px;border:2px solid var(--border-control);display:grid;place-items:center;color:var(--background)}
.sub--done .sub__check{background:var(--secondary);border-color:var(--secondary)}
.sub__check svg{width:12px;height:12px}
.sub a{display:inline-flex;align-items:center;min-height:24px}
.sub__desc{font-size:13px;color:var(--text-subtle)}
.mods{border-radius:var(--radius-xl);border:1px dashed var(--border-control);padding:14px}
.mods ol{margin:8px 0 0 18px;color:var(--text-muted);font-size:14px}

/* Prueba (checkpoint) */
.step--trial .node{width:40px;height:40px;left:-54px;top:16px;transform:none;border-radius:50%;border-color:var(--secondary);color:var(--secondary)}
.step--trial .node svg{transform:none;width:22px;height:22px}
.step--trial.step--done .node{background:var(--secondary);color:var(--background)}
.trial{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:16px 20px;border-radius:var(--radius-card);border:1px solid var(--secondary);background:linear-gradient(90deg,rgba(0,194,255,.08),transparent 70%)}
.trial__main{flex:1;min-width:200px}
.trial .eyebrow{color:var(--secondary)}
.trial__name{font-weight:700;font-size:16px;margin-top:2px}

/* Rango final */
.step--rank{padding:8px 0 64px}
.step--rank .node{left:-50px;top:4px;width:32px;height:32px;border-color:var(--primary);color:var(--primary)}
.step--rank.step--done .node{background:var(--primary);color:var(--background)}
.rank__name{font-size:40px;line-height:1.1;color:var(--primary)}
.rank__text{font-size:15px;color:var(--text-muted);margin:4px 0 16px;max-width:520px}

/* Barra de vista previa (no es parte del diseño) */
.pv{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:var(--radius-full);background:#111;border:1px solid var(--border-control);font-size:13px}
.pv button{border:0;background:none;color:var(--text-muted);padding:8px 14px;border-radius:var(--radius-full);cursor:pointer;font:inherit;min-height:36px}
.pv button[aria-pressed=true]{background:var(--foreground);color:#000}
.pv span{align-self:center;padding:0 8px;color:var(--text-subtle)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="pv" aria-label="Controles de la vista previa">

<script>
/* ===== Íconos ===== */
const ICON_PATH={

};
const I={
 hiltH:'<svg width="40" height="18" viewBox="0 0 40 18" aria-hidden="true"><circle cx="4" cy="9" r="4" fill="currentColor"/><rect x="8" y="6" width="14" height="6" rx="2" fill="currentColor" opacity=".7"/><rect x="22" y="0" width="5" height="18" rx="2" fill="currentColor"/></svg>',
 hiltV:'<svg viewBox="0 0 48 76" aria-hidden="true"><circle cx="24" cy="7" r="7" fill="currentColor"/><rect x="19" y="13" width="10" height="30" rx="3" fill="currentColor" opacity=".7"/><path d="M2 44h44a2 2 0 0 1 0 8H2a2 2 0 0 1 0-8z" fill="currentColor"/><rect x="21" y="52" width="6" height="24" fill="currentColor"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
 swords:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5L18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/></svg>',
 crown:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>',

};

/* ===== Datos: forma real de la API (contenido de ejemplo) ===== */
const FCC=(ext,name)=>({id:"cert-"+ext,provider:"FREECODECAMP",externalId:ext,name,url:`https://www.freecodecamp.org/learn/${ext}/`});
const RWD=FCC("responsive-web-design-v9","Responsive Web Design (v9)"),JS=FCC("javascript-v9","JavaScript (v9)"),FEL=FCC("front-end-development-libraries-v9","Front End Development Libraries (v9)");
const BE=FCC("back-end-development-and-apis-v9","Back End Development and APIs (v9)"),RDB=FCC("relational-database-v9","Relational Database (v9)");
const withMods=(c,mods)=>({...c,isActive:true,modules:mods.map((t,i)=>({externalId:t.toLowerCase().replace(/\W+/g,"-"),title:t,position:i}))});
const sub=(id,title,url,description=null,position=0)=>({id,title,url,description,position});

const PATHS=[
 {id:"01a13dea-d907-76be-874a-f90ecd316e7f",name:"Initiated",slug:"initiated",description:"Path de Frontend",currentVersion:2},
 {id:"01a13dea-d91d-70db-b411-9dc61bc2e3a2",name:"Wanderer",slug:"wanderer",description:"Path de Backend",currentVersion:2}
];
const DETAIL={
 initiated:{id:"01a13dea-d907-76be-874a-f90ecd316e7f",name:"Initiated",slug:"initiated",description:"Path de Frontend",version:2,isCurrent:true,
  requiredCertifications:[RWD,JS,FEL],
  topics:[
   {id:"t1",title:"HTML y CSS",description:null,position:0,isOptional:false,certifications:[withMods(RWD,["Basic HTML","Basic CSS","Flexbox","CSS Grid","Responsive Design"])],
    subtopics:[sub("s1","Flexbox Froggy","https://flexboxfroggy.com",null,0),sub("s2","Grid Garden","https://cssgridgarden.com","Practica CSS Grid jugando.",1),sub("s3","CSS Diner","https://flukeout.github.io","Selectores CSS.",2)]},
   {id:"t2",title:"Git y GitHub",description:"Control de versiones para trabajar en equipo.",position:1,isOptional:true,certifications:[],
    subtopics:[sub("s4","Learn Git Branching","https://learngitbranching.js.org",null,0)]},
   {id:"t3",title:"JavaScript",description:null,position:2,isOptional:false,certifications:[withMods(JS,["Variables y tipos","Funciones","Arrays y objetos","DOM","Asincronía"])],
    subtopics:[sub("s5","javascript.info","https://javascript.info",null,0),sub("s6","MDN – Guía de JavaScript","https://developer.mozilla.org/es/docs/Web/JavaScript/Guide",null,1)]},
   {id:"t4",title:"React y librerías frontend",description:null,position:3,isOptional:false,certifications:[withMods(FEL,["Bootstrap","jQuery","Sass","React","Redux"])],
    subtopics:[sub("s7","react.dev – Aprende React","https://react.dev/learn",null,0),sub("s8","Redux Essentials","https://redux.js.org/tutorials/essentials/part-1-overview-concepts",null,1)]}
  ]},
 wanderer:{id:"01a13dea-d91d-70db-b411-9dc61bc2e3a2",name:"Wanderer",slug:"wanderer",description:"Path de Backend",version:2,isCurrent:true,
  requiredCertifications:[RDB,BE],
  topics:[
   {id:"w1",title:"Bases de datos relacionales",description:null,position:0,isOptional:false,certifications:[withMods(RDB,["Bash","SQL y PostgreSQL","Git"])],
    subtopics:[sub("w1a","SQLBolt","https://sqlbolt.com",null,0)]},
   {id:"w2",title:"Node.js y APIs",description:null,position:1,isOptional:false,certifications:[withMods(BE,["npm","Express","MongoDB y Mongoose"])],
    subtopics:[sub("w2a","Node.js – Learn","https://nodejs.org/en/learn",null,0)]}
  ]}
};
/* Progreso sugerido (solo logueado) */
const PROGRESS={completedSubtopicIds:["s1","s2","s3","s4","s5"],earnedCertificationIds:["cert-responsive-web-design-v9"]};

/* ===== Lógica ===== */
const roman=n=>["I","II","III","IV","V","VI","VII","VIII","IX","X"][n]||String(n+1);
const pad=n=>String(n+1).padStart(2,"0");
const byPos=(a,b)=>a.position-b.position;
const provider=p=>({FREECODECAMP:"freeCodeCamp"}[p]||p);

function buildTrail(path,progress){
  const topics=[...path.topics].sort(byPos);
  // cada certificación se coloca como "Prueba" después del último tema que la referencia
  const lastIdx={};topics.forEach((t,i)=>t.certifications.forEach(c=>lastIdx[c.externalId]=i));
  const earned=new Set(progress?.earnedCertificationIds||[]),doneSubs=new Set(progress?.completedSubtopicIds||[]);
  const items=[];let trialN=0,currentSet=false;
  topics.forEach((t,i)=>{
    const subs=[...t.subtopics].sort(byPos);
    const subsDone=subs.filter(s=>doneSubs.has(s.id)).length;
    const certsDone=t.certifications.every(c=>earned.has(c.id));
    let status=null;
    if(progress){status=(subsDone===subs.length&&certsDone)?"done":(!currentSet&&!t.isOptional?(currentSet=true,"current"):"pending")}
    items.push({kind:"topic",t,subs,subsDone,status,i});
    path.requiredCertifications.filter(c=>lastIdx[c.externalId]===i).forEach(c=>{
      items.push({kind:"trial",c,n:trialN++,status:progress?(earned.has(c.id)?"done":"pending"):null});
    });
  });
  // certificaciones requeridas sin tema asociado van antes del rango
  path.requiredCertifications.filter(c=>lastIdx[c.externalId]===undefined).forEach(c=>items.push({kind:"trial",c,n:trialN++,status:progress?(earned.has(c.id)?"done":"pending"):null}));
  const req=path.requiredCertifications.length,got=path.requiredCertifications.filter(c=>earned.has(c.id)).length;
  const allSubs=topics.filter(t=>!t.isOptional).flatMap(t=>t.subtopics),subsGot=allSubs.filter(s=>doneSubs.has(s.id)).length;
  const pct=Math.round(((subsGot+got)/((allSubs.length+req)||1))*100);
  return {items,topics,req,got,pct,complete:progress&&got===req};
}

/* ===== Vistas ===== */
function Home(){
  return `<section class="paths-section" aria-labelledby="paths-title"><div class="wrap">
    <h2 id="paths-title" class="display section-title">Nuestros <span>Paths</span></h2>
    <p class="section-lead">Elige tu camino, forja tu espada y supera las pruebas para ganar tu rango.</p>
    <div class="paths-grid">${PATHS.map(p=>{
      const d=DETAIL[p.slug];
      return `<article class="path-card">
        <div class="path-card__top">${ICON_PATH[p.slug]||""}
          <div><p class="eyebrow">Rango · v${p.currentVersion}</p><h3 class="display path-card__name">${p.name}</h3><p class="path-card__desc">${p.description}</p></div>
        </div>
        <div class="sword-rule" aria-hidden="true">${I.hiltH}<i></i><b></b></div>
        ${d?`<div class="path-card__meta">
          <div><strong>${d.topics.length}</strong><span class="eyebrow">Temas</span></div>
          <div><strong>${d.requiredCertifications.length}</strong><span class="eyebrow">Pruebas</span></div>
        </div>`:""}
        <a class="btn btn--full" href="#/paths/${p.slug}">Ver path</a>
      </article>`}).join("")}
    </div></div></section>`;
}

function Detail(path,progress){
  const {items,topics,req,got,pct,complete}=buildTrail(path,progress);
  const resources=topics.reduce((n,t)=>n+t.subtopics.length,0);
  const certList=path.requiredCertifications.map(c=>{
    const done=progress&&progress.earnedCertificationIds.includes(c.id);
    return `<li class="cert ${done?"cert--done":""}"><span class="cert__icon">${I.shield}</span><div>
      <p class="cert__name">${c.name}</p><p class="cert__meta">${provider(c.provider)}</p>
      ${progress?`<p class="cert__status" style="${done?"":"color:var(--text-subtle)"}">${done?"Superada":"Pendiente"}</p>`:""}
      <a class="link" href="${c.url}" target="_blank" rel="noopener noreferrer">Ir a la certificación${I.ext}<span class="sr-only"> (se abre en una pestaña nueva)</span></a>
    </div></li>`}).join("");

  const steps=items.map(it=>{
    if(it.kind==="trial"){
      const st=it.status?`step--${it.status}`:"";
      return `<li class="step step--trial ${st}"><span class="node">${it.status==="done"?I.check:I.swords}</span>
        <div class="trial"><div class="trial__main"><p class="eyebrow">Prueba ${roman(it.n)}${it.status==="done"?" · Superada":""}</p>
        <p class="trial__name">${it.c.name}</p></div>
        <a class="link" href="${it.c.url}" target="_blank" rel="noopener noreferrer">Ver en ${provider(it.c.provider)}${I.ext}</a></div></li>`;
    }
    const t=it.t,st=it.status?`step--${it.status}`:"",pid=`panel-${t.id}`;
    const statusTxt={done:"Completado",current:"En curso",pending:"Pendiente"}[it.status];
    return `<li class="step ${st}"><span class="node">${it.status==="done"?I.check:""}</span>
      <div class="topic">
        <button class="topic__btn" aria-expanded="false" aria-controls="${pid}">
          <span class="topic__num">${pad(it.i)}</span>
          <span class="topic__main"><span class="topic__title">${t.title}</span>
            <span class="topic__info">${t.isOptional?'<span class="tag">Opcional</span>':""}
              <span>${it.subs.length} recurso${it.subs.length===1?"":"s"}</span>
              ${t.certifications.length?`<span>· ${t.certifications.length} prueba</span>`:""}
              ${it.status?`<span class="topic__status">· ${statusTxt}${it.subs.length?` (${it.subsDone}/${it.subs.length})`:""}</span>`:""}
            </span></span>${I.chev}
        </button>
        <div class="topic__panel" id="${pid}" role="region" aria-label="${t.title}"><div><div class="topic__body">
          ${t.description?`<p class="topic__desc">${t.description}</p>`:""}
          <div><p class="eyebrow" style="margin-bottom:8px">Recursos</p><ol class="subs">${it.subs.map(s=>{
            const d=progress&&progress.completedSubtopicIds.includes(s.id);
            return `<li class="sub ${d?"sub--done":""}">${progress?`<span class="sub__check" aria-label="${d?"Completado":"Pendiente"}">${d?I.check:""}</span>`:""}
              <div><a class="link" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}${I.ext}</a>${s.description?`<p class="sub__desc">${s.description}</p>`:""}</div></li>`}).join("")}
          </ol></div>
          ${t.certifications.map(c=>`<div class="mods"><p class="eyebrow">Módulos de ${c.name}</p><ol>${[...c.modules].sort(byPos).map(m=>`<li>${m.title}</li>`).join("")}</ol></div>`).join("")}
        </div></div></div>
      </div></li>`;
  }).join("");

  const fillPct=progress?Math.min(100,pct):0;
  return `<header class="hero"><div class="wrap">
      <a class="link back" href="#/">← Todos los paths</a>
      <div class="hero__grid">${ICON_PATH[path.slug]||""}
        <div><p class="eyebrow">${path.description} · v${path.version}${path.isCurrent?"":" · versión anterior"}</p>
          <h1 class="display hero__title">${path.name}</h1>
          <p class="hero__lead">Recorre el camino de la espada: completa cada tema y supera las pruebas para ganar tu rango.</p>
          <p class="hero__stats"><span><b>${topics.length}</b> temas</span><span><b>${resources}</b> recursos</span><span><b>${req}</b> pruebas requeridas</span></p>
          ${progress?`<div class="progress"><div class="progress__row"><span class="eyebrow">Tu forja</span><span class="progress__pct">${pct}%</span></div>
            <div class="progress__bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso del path"><i style="width:${pct}%"></i></div></div>`:""}
        </div>
        ${progress?"":`<a class="btn hero__cta" href="#registro">Elegir este path</a>`}
      </div></div></header>
    <div class="wrap detail">
      <aside class="aside" aria-labelledby="req-title">
        <h2 id="req-title" class="display aside__title">Pruebas requeridas</h2>
        <p class="aside__sub">${progress?`${got} de ${req} superadas`:`Necesitas estas ${req} certificaciones gratuitas para aprobar el path.`}</p>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:12px">${certList}</ul>
      </aside>
      <section aria-label="Camino del path">
        <ol class="trail ${complete?"is-complete":""}">
          <span class="hilt" aria-hidden="true">${I.hiltV}</span>
          <span class="trail__fill" aria-hidden="true" data-pct="${fillPct}"></span>
          <li class="trail__head" aria-hidden="true"></li>
          ${steps}
          <li class="step step--rank ${complete?"step--done":""}"><span class="node">${I.crown}</span>
            <p class="eyebrow">${complete?"Rango obtenido":"Rango al completar"}</p>
            <p class="display rank__name">${path.name}</p>
            <p class="rank__text">${complete?"Superaste todas las pruebas. Tu espada está forjada.":"Supera las "+req+" pruebas para obtener este rango y que te asignemos un Mentor."}</p>
            ${progress?"":`<a class="btn" href="#registro">Elegir este path</a>`}
          </li>
          <span class="tip" aria-hidden="true"></span>
        </ol>
      </section>
    </div>`;
}

/* ===== Router de la vista previa ===== */
let mode="public";
function render(){
  const app=document.getElementById("app"),m=location.hash.match(/#\/paths\/([\w-]+)/);
  const slug=m&&DETAIL[m[1]]?m[1]:null;
  app.innerHTML=slug?Detail(DETAIL[slug],mode==="auth"&&slug==="initiated"?PROGRESS:(mode==="auth"?{completedSubtopicIds:[],earnedCertificationIds:[]}:null)):Home();
  document.getElementById("pv-home").setAttribute("aria-pressed",!slug);
  document.getElementById("pv-public").setAttribute("aria-pressed",!!slug&&mode==="public");
  document.getElementById("pv-auth").setAttribute("aria-pressed",!!slug&&mode==="auth");
  app.querySelectorAll(".topic__btn").forEach(b=>b.addEventListener("click",()=>{
    const open=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",open);
    document.getElementById(b.getAttribute("aria-controls")).classList.toggle("open",open);setTimeout(sizeFill,320);
  }));
  // abre el tema en curso (o el primero) por defecto
  const first=app.querySelector(".step--current .topic__btn")||app.querySelector(".topic__btn");if(first)first.click();
  sizeFill();window.scrollTo(0,0);
}
function sizeFill(){
  const f=document.querySelector(".trail__fill");if(!f)return;
  const trail=f.parentElement,pct=+f.dataset.pct;
  // la hoja se llena hasta el último paso completado
  const done=[...trail.querySelectorAll(".step--done:not(.step--rank)")].pop();
  const total=trail.offsetHeight-72-48;
  f.style.height=(pct?(done?Math.min(total,done.offsetTop+done.offsetHeight/2-72):0):0)+"px";
}
window.addEventListener("hashchange",render);window.addEventListener("resize",sizeFill);
document.getElementById("pv-home").onclick=()=>{location.hash="#/"};
document.getElementById("pv-public").onclick=()=>{mode="public";if(!location.hash.includes("/paths/"))location.hash="#/paths/initiated";else render()};
document.getElementById("pv-auth").onclick=()=>{mode="auth";if(!location.hash.includes("/paths/"))location.hash="#/paths/initiated";else render()};
render();
</script>
</body>
