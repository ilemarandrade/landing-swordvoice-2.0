  @media(min-width:768px){.section{padding-inline:var(--space-12)}}
  .wrap{max-width:var(--content-max);margin:0 auto}
  /* display-lg (36/40 mobile → 48/48 md) */
  .title{font-family:var(--font-display);font-weight:400;font-size:36px;line-height:40px;text-align:center;margin-bottom:var(--space-3)}
  @media(min-width:768px){.title{font-size:48px;line-height:1}}
  .title span{color:var(--primary)}
  /* lead */
  .lead{font-size:17px;line-height:1.625;color:var(--text-soft);text-align:center;max-width:560px;margin:0 auto var(--space-8)}

  .grid{display:grid;gap:var(--space-6);grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

  /* Card: card-light, radius-card, sin sombras */
  .card{display:flex;flex-direction:column;background:var(--card-light);color:#000;border-radius:var(--radius-card);overflow:hidden;
    transition:transform .3s ease}
  .card:hover{transform:translateY(-4px)}
  @media(prefers-reduced-motion:reduce){.card,.photo img{transition:none}.card:hover{transform:none}}

  .photo{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--blue)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .6s ease}
  .card:hover .photo img{transform:scale(1.04)}
  .initials{height:100%;display:grid;place-items:center;font-family:var(--font-display);font-size:96px;color:rgba(255,255,255,.2)}
  /* Degradado hacia `blue`, como SwordvoicesCard */
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--blue) 100%)}
  .id{position:absolute;z-index:1;left:var(--space-6);right:var(--space-6);bottom:var(--space-4)}
  /* eyebrow: 12/16, uppercase, 0.05em */
  .eyebrow{font-size:12px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-soft);margin-bottom:var(--space-1-5)}
  /* display-md 32px (display ≥22px, peso 400) */
  .name{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.25;color:var(--foreground)}

  .body{display:flex;flex-direction:column;flex:1;padding:var(--space-6)}
  /* card-title 24/32 bold */
  .role{font-size:24px;line-height:32px;font-weight:700;margin-bottom:var(--space-3)}
  /* body: 14/20 mobile → 16/24 md */
  .bio{font-size:14px;line-height:20px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  @media(min-width:768px){.bio{font-size:16px;line-height:24px}}
  /* tag: 11/16 uppercase 0.05em */
  .tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4);list-style:none}
  .tag{font-size:11px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);
    border:1px solid var(--blue);border-radius:var(--radius-full);padding:2px 10px}

  .socials{display:flex;gap:var(--space-2);margin-top:auto;padding-top:var(--space-6)}
  /* Área táctil mínima space-11 (44px) */
  .soc{width:var(--space-11);height:var(--space-11);display:grid;place-items:center;border-radius:var(--radius-full);transition:background .2s}
  .soc:hover{background:var(--grey-ligth)}
  .soc:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .soc svg{width:28px;height:28px}
  .soc.li{color:var(--linkedin)} .soc.gh{color:#000} .soc.web{color:var(--blue)}
</style>
</head>

<section class="section" aria-labelledby="sv-title">
  <div class="wrap">
    <h2 class="title" id="sv-title">Nuestras <span>Swordvoices</span></h2>
    <p class="lead">Mentores que ya recorrieron el camino que estás empezando. Te asignamos uno según tu path.</p>
    <div class="grid" id="grid"></div>
  </div>
</section>
<script>
